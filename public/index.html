<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Generator</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --primary: #6c5ce7;
            --text: #ffffff;
            --text-secondary: #a0a0a0;
            --border: #2a2a2a;
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        input, button {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 0.75rem;
            transition: border 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.danger { background: var(--danger); }
        button.secondary { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .error { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; }
        .success { color: var(--success); font-size: 0.85rem; }
        .status { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
        .status.ready { background: #1a472a; color: #2ecc71; }
        .status.generating { background: #3d3520; color: #f1c40f; }
        .status.failed { background: #3d1f1f; color: #e74c3c; }
        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border);
        }
        .track-item:last-child { border-bottom: none; }
        audio { width: 100%; margin-top: 0.5rem; }
        .hidden { display: none; }
        .section-title { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 AI Music Generator</h1>

        <!-- Auth Card -->
        <div class="card" id="authCard">
            <div class="section-title">Get Started</div>
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Password" />
            <div style="display: flex; gap: 0.5rem;">
                <button onclick="register()">Register</button>
                <button class="secondary" onclick="login()">Log In</button>
            </div>
            <div id="authError" class="error"></div>
        </div>

        <!-- App Card (hidden until login) -->
        <div class="card hidden" id="appCard">
            <div class="section-title">Generate New Track</div>
            <input type="text" id="trackTitle" placeholder="Track title" />
            <input type="text" id="trackPrompt" placeholder="Describe your music (e.g., 'Jazz piano, rainy night')" />
            <button onclick="generateTrack()">✨ Generate Track</button>
            <div id="genStatus" class="success"></div>

            <div class="section-title" style="margin-top: 1.5rem;">Your Tracks</div>
            <div id="tracksList">Loading...</div>
        </div>
    </div>

    <script>
        const API = ''; // server is on same origin
        let token = '';

        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(API + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: 'user' })
                });
                const text = await res.text();
                console.log('Register response:', text);
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error('Server returned invalid JSON: ' + text.substring(0, 100));
                }
                if (!res.ok) throw new Error(data.error || 'Registration failed');
                document.getElementById('authError').textContent = 'Registered! You can log in now.';
            } catch (err) {
                document.getElementById('authError').textContent = err.message;
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(API + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const text = await res.text();
                console.log('Login response:', text);
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error('Server returned invalid JSON: ' + text.substring(0, 100));
                }
                if (!res.ok) throw new Error(data.error || 'Login failed');
                token = data.token;
                document.getElementById('authCard').classList.add('hidden');
                document.getElementById('appCard').classList.remove('hidden');
                loadTracks();
            } catch (err) {
                document.getElementById('authError').textContent = err.message;
            }
        }

        async function generateTrack() {
            const title = document.getElementById('trackTitle').value;
            const prompt = document.getElementById('trackPrompt').value;
            if (!title || !prompt) return;
            document.getElementById('genStatus').textContent = '';
            try {
                const res = await fetch(API + '/tracks/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ title, prompt })
                });
                const text = await res.text();
                console.log('Generate response:', text);
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    throw new Error('Server returned invalid JSON: ' + text.substring(0, 100));
                }
                if (!res.ok) throw new Error(data.error || 'Generation failed');
                document.getElementById('genStatus').textContent = 'Track created! Status: ' + data.status;
                document.getElementById('trackTitle').value = '';
                document.getElementById('trackPrompt').value = '';
                setTimeout(loadTracks, 3000);
            } catch (err) {
                document.getElementById('genStatus').textContent = 'Error: ' + err.message;
            }
        }

        async function loadTracks() {
    try {
        const res = await fetch(API + '/tracks', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.status === 401) {
            // Токен истёк или отсутствует — просим войти заново
            document.getElementById('tracksList').innerHTML = '<div style="color: var(--danger)">Session expired. Please <a href="#" onclick="logout()">log in</a> again.</div>';
            return;
        }
        const data = await res.json();
        // ... остальная логика рендера ...
    } catch (err) {
        document.getElementById('tracksList').innerHTML = '<div style="color: var(--danger)">Network error. Please refresh or log in again.</div>';
    }
}

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
